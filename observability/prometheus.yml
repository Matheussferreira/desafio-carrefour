global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lancamentos
    static_configs:
      - targets: ['lancamentos:3001']
    metrics_path: /metrics

  - job_name: consolidado
    static_configs:
      - targets: ['consolidado:3002']
    metrics_path: /metrics

  - job_name: lancamentos-relay
    static_configs:
      - targets: ['lancamentos-relay:3003']
    metrics_path: /metrics
