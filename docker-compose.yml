
services:
  # ─── Infraestrutura ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    # Fuso de negócio também no banco (CURRENT_DATE, now()::date e logs).
    command: ["postgres", "-c", "timezone=America/Sao_Paulo", "-c", "log_timezone=America/Sao_Paulo"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/00-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # Hostname fixo: o nome do nó do RabbitMQ deriva dele. Sem isso, cada container novo
    # ganha um nome diferente e não reaproveita o estado gravado no volume.
    hostname: rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbit}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Checagem de porta, que custa quase nada. O rabbitmq-diagnostics ping sobe uma VM Erlang nova
      # a cada execução e, em uma máquina com poucos núcleos, passou de 100% de CPU por vários segundos
      # a cada 10 s, roubando CPU dos serviços (p95 do consolidado de 26 ms para mais de 400 ms).
      # Ele também precisaria rodar como usuário rabbitmq, senão cria um .erlang.cookie de root.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "6379:6379"

  # Provedor de identidade (OIDC). Modo de desenvolvimento: banco embutido e realm importado.
  # Os serviços só consultam o JWKS dele; se o Keycloak cair, tokens já emitidos continuam
  # válidos até expirar e as chaves ficam em cache nos serviços.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Issuer estável (http://localhost:8080/realms/caixa) seja qual for o host usado na chamada,
      # porque os serviços validam o claim iss por igualdade.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-caixa.json:/opt/keycloak/data/import/realm-caixa.json:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout --preserve-status 2 cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    ports:
      - "8080:8080"

  # ─── Serviços de negócio ───────────────────────────────────────────────────

  # API de lançamentos: só depende do banco. Não fala com o RabbitMQ.
  lancamentos:
    image: caixa/lancamentos:local
    build:
      context: ./services/lancamentos
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lancamentos_db
      # Issuer público (igual ao claim iss dos tokens) e JWKS pela rede interna
      OIDC_ISSUER: http://localhost:8080/realms/caixa
      OIDC_JWKS_URI: http://keycloak:8080/realms/caixa/protocol/openid-connect/certs
      OIDC_AUDIENCE: lancamentos-api
      # Tracing desligado por padrão (sem endpoint, o SDK nem inicia). Para ligar com o Jaeger, use
      # docker-compose.tracing.yml junto com o profile observability (ver README).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: lancamentos
      TZ: America/Sao_Paulo
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Publica o outbox no RabbitMQ. Mesma imagem da API, outro processo; pode ter várias réplicas.
  lancamentos-relay:
    image: caixa/lancamentos:local
    build:
      context: ./services/lancamentos
      dockerfile: Dockerfile
    command: ["node", "dist/relayMain.js"]
    environment:
      NODE_ENV: production
      RELAY_PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lancamentos_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbit}:${RABBITMQ_PASS:-rabbit}@rabbitmq:5672
      # Tracing desligado por padrão (sem endpoint, o SDK nem inicia). Para ligar com o Jaeger, use
      # docker-compose.tracing.yml junto com o profile observability (ver README).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: lancamentos-relay
      TZ: America/Sao_Paulo
    # Sem porta publicada no host de propósito: assim dá para subir várias réplicas
    # (docker compose up -d --scale lancamentos-relay=3). Saúde e métricas ficam na rede interna.
    expose:
      - "3003"
    depends_on:
      lancamentos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  consolidado:
    build:
      context: ./services/consolidado
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/consolidado_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbit}:${RABBITMQ_PASS:-rabbit}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      OIDC_ISSUER: http://localhost:8080/realms/caixa
      OIDC_JWKS_URI: http://keycloak:8080/realms/caixa/protocol/openid-connect/certs
      OIDC_AUDIENCE: consolidado-api
      # Tracing desligado por padrão (sem endpoint, o SDK nem inicia). Para ligar com o Jaeger, use
      # docker-compose.tracing.yml junto com o profile observability (ver README).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: consolidado
      TZ: America/Sao_Paulo
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ─── Testes unitários (profile opcional) ──────────────────────────────────
  # Imagem do estágio "test" do Dockerfile, que tem as dependências de desenvolvimento.
  # Uso: docker compose --profile test run --rm lancamentos-test

  lancamentos-test:
    profiles: ["test"]
    build:
      context: ./services/lancamentos
      target: test

  consolidado-test:
    profiles: ["test"]
    build:
      context: ./services/consolidado
      target: test

  # ─── Teste de carga (profile opcional) ────────────────────────────────────

  k6:
    image: grafana/k6:0.52.0
    profiles: ["loadtest"]
    volumes:
      - ./tests/load:/scripts
      - ./docs/evidencias:/evidencias
    environment:
      LANCAMENTOS_URL: http://lancamentos:3001
      CONSOLIDADO_URL: http://consolidado:3002
      # Credencial de integração do comerciante loja-1 (segredo de desenvolvimento do realm importado)
      KEYCLOAK_URL: http://keycloak:8080
      CLIENT_ID: erp-loja-1
      CLIENT_SECRET: dev-segredo-erp-loja-1
    command: run --summary-export=/evidencias/k6-consolidado-resumo.json /scripts/consolidado.js
    depends_on:
      keycloak:
        condition: service_healthy
      lancamentos:
        condition: service_healthy
      consolidado:
        condition: service_healthy

  # ─── Observabilidade (profile opcional) ───────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"

  # Traces (OTLP/HTTP na 4318, interface na 16686). Armazenamento em memória: some ao reiniciar.
  jaeger:
    image: jaegertracing/all-in-one:1.58.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "20000"
    ports:
      - "16686:16686"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data:
