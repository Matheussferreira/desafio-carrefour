
services:
  # ─── Infraestrutura ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    # Fuso de negócio também no banco (CURRENT_DATE, now()::date e logs).
    command: ["postgres", "-c", "timezone=America/Sao_Paulo", "-c", "log_timezone=America/Sao_Paulo"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/00-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # Hostname fixo: o nome do nó do RabbitMQ deriva dele. Sem isso, cada container novo
    # ganha um nome diferente e não reaproveita o estado gravado no volume.
    hostname: rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbit}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Roda como usuário rabbitmq. Como root, um ping que chega antes de o servidor criar o
      # .erlang.cookie cria o arquivo com dono root, e o RabbitMQ morre com eacces ao lê-lo.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "6379:6379"

  # ─── Serviços de negócio ───────────────────────────────────────────────────

  # API de lançamentos: só depende do banco. Não fala com o RabbitMQ.
  lancamentos:
    image: caixa/lancamentos:local
    build:
      context: ./services/lancamentos
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lancamentos_db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      TZ: America/Sao_Paulo
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Publica o outbox no RabbitMQ. Mesma imagem da API, outro processo; pode ter várias réplicas.
  lancamentos-relay:
    image: caixa/lancamentos:local
    build:
      context: ./services/lancamentos
      dockerfile: Dockerfile
    command: ["node", "dist/relayMain.js"]
    environment:
      NODE_ENV: production
      RELAY_PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/lancamentos_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbit}:${RABBITMQ_PASS:-rabbit}@rabbitmq:5672
      TZ: America/Sao_Paulo
    # Sem porta publicada no host de propósito: assim dá para subir várias réplicas
    # (docker compose up -d --scale lancamentos-relay=3). Saúde e métricas ficam na rede interna.
    expose:
      - "3003"
    depends_on:
      lancamentos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  consolidado:
    build:
      context: ./services/consolidado
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/consolidado_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-rabbit}:${RABBITMQ_PASS:-rabbit}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      TZ: America/Sao_Paulo
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ─── Teste de carga (profile opcional) ────────────────────────────────────

  k6:
    image: grafana/k6:0.52.0
    profiles: ["loadtest"]
    volumes:
      - ./tests/load:/scripts
    environment:
      LANCAMENTOS_URL: http://lancamentos:3001
      CONSOLIDADO_URL: http://consolidado:3002
    command: run /scripts/consolidado.js
    depends_on:
      lancamentos:
        condition: service_healthy
      consolidado:
        condition: service_healthy

  # ─── Observabilidade (profile opcional) ───────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data:
