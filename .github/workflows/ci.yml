name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos e testes unitários (${{ matrix.servico }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [lancamentos, consolidado]
    defaults:
      run:
        working-directory: services/${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.servico }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Verificação de tipos
        run: npx tsc --noEmit
      - name: Testes unitários
        run: npm run test:unit

  integracao:
    name: Testes de integração (Postgres, RabbitMQ e Redis reais)
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash test-integration.sh

  imagens:
    name: Build da imagem (${{ matrix.servico }})
    runs-on: ubuntu-latest
    needs: qualidade
    strategy:
      fail-fast: false
      matrix:
        servico: [lancamentos, consolidado]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.servico }}
          push: false
          tags: caixa/${{ matrix.servico }}:ci
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  compose:
    name: Validação do docker-compose e do dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose válido, com e sem os profiles
        run: |
          docker compose config -q
          docker compose --profile observability --profile loadtest config -q
          docker compose -f docker-compose.integration.yml config -q
      - name: Compose do profile de testes e sintaxe do script de reprocessamento da DLQ
        run: |
          docker compose --profile test config -q
          node --check scripts/reprocessar-dlq.js
          bash -n scripts/reprocessar-dlq.sh
      - name: Dashboard do Grafana é um JSON válido
        run: node -e "JSON.parse(require('fs').readFileSync('observability/grafana/provisioning/dashboards/caixa-flow.json','utf8'))"
